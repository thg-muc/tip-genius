<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="description" content="How well do the AI models tip? Points, hit types and trend compared with the odds favourite.">
    <title>Stats (variant A: table) – Tip Genius</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽️</text></svg>">
    <link rel="stylesheet" href="/css/tailwind.css">
    <!-- Chart.js 4 (UMD build, exposes window.Chart) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
</head>

<body class="font-sans flex flex-col min-h-screen bg-gradient-to-br from-slate-100 to-slate-300 dark:from-slate-900 dark:to-blue-950 text-gray-800 dark:text-gray-200">
    <header class="bg-white bg-opacity-80 dark:bg-gray-800 dark:bg-opacity-80 backdrop-blur-md shadow-md sticky top-0 z-30 mb-3 sm:mb-6">
        <div class="container mx-auto px-4 py-2 sm:py-3">
            <div class="flex items-center justify-between">
                <a href="/" class="flex items-center group transition duration-200">
                    <span class="text-base sm:text-2xl mr-2">⚽️</span>
                    <span class="text-base sm:text-2xl font-bold text-gray-800 dark:text-gray-200 sm:hover:text-sky-700 dark:hover:text-sky-400 transition duration-200">Tip Genius</span>
                </a>
                <nav class="flex items-center gap-1 text-sm sm:text-base">
                    <a href="/" class="h-10 inline-flex items-center px-2 sm:px-3 rounded-lg text-gray-500 dark:text-gray-400 hover:text-sky-700 dark:hover:text-sky-400">Tips</a>
                    <span class="h-10 inline-flex items-center px-2 sm:px-3 rounded-lg font-semibold text-sky-700 dark:text-sky-400 bg-sky-50 dark:bg-slate-900" aria-current="page">Stats</span>
                </nav>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-3 sm:px-4 py-1 flex-grow max-w-6xl">
        <div class="text-center mb-4 sm:mb-6">
            <h1 class="text-2xl sm:text-4xl font-bold tracking-wide text-gray-800 dark:text-gray-200 mb-1">Leaderboard</h1>
            <p class="text-gray-500 dark:text-gray-400 text-xs sm:text-lg italic">Do the AI models beat the odds favourite?</p>
        </div>

        <!-- League tabs (same look as the main page) -->
        <div class="flex justify-center mb-3">
            <div class="w-full sm:w-auto sm:inline-flex flex shadow-md rounded-md overflow-hidden">
                <div id="league-tabs" class="flex w-full" role="tablist" aria-label="League"></div>
            </div>
        </div>

        <!-- Notice slot (reserved even when empty, see notesWithPlaceholder) -->
        <div id="notes" class="space-y-2 mb-3"></div>

        <!-- Season and options -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-3">
            <div id="season-control" class="inline-flex self-center sm:self-auto rounded-md shadow-sm overflow-hidden" role="group" aria-label="Season"></div>
            <div id="toggles" class="flex flex-wrap justify-center gap-x-4 gap-y-1 text-xs sm:text-sm text-gray-600 dark:text-gray-300"></div>
        </div>

        <div id="error" class="hidden bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300 px-4 py-3 rounded-lg text-center my-8" role="alert"></div>

        <!-- Leaderboard -->
        <section class="bg-white dark:bg-gray-800 shadow-md rounded-2xl overflow-hidden mb-4 sm:mb-6" aria-labelledby="table-title">
            <div class="flex items-baseline justify-between px-3 sm:px-5 pt-3 pb-2">
                <h2 id="table-title" class="text-base sm:text-xl font-bold">Table</h2>
                <p id="table-meta" class="text-xs sm:text-sm text-gray-500 dark:text-gray-400"></p>
            </div>
            <div class="overflow-x-auto">
                <table id="leaderboard" class="w-full text-xs sm:text-sm tabular-nums"></table>
            </div>
            <div id="table-legend" class="px-3 sm:px-5 py-3 text-xs text-gray-500 dark:text-gray-400 border-t border-gray-100 dark:border-gray-700"></div>
        </section>

        <!-- Detail tabs -->
        <div class="flex justify-center mb-3">
            <div id="view-tabs" class="inline-flex rounded-md shadow-sm overflow-hidden" role="tablist" aria-label="View"></div>
        </div>
        <section id="panel" class="bg-white dark:bg-gray-800 shadow-md rounded-2xl p-3 sm:p-5 mb-6" role="tabpanel"></section>
    </main>

    <footer class="bg-white bg-opacity-80 dark:bg-gray-800 dark:bg-opacity-80 backdrop-blur-md mt-2">
        <div class="container mx-auto px-6 py-4 text-xs sm:text-sm text-gray-500 dark:text-gray-400 text-center space-y-2">
            <p><strong class="font-semibold">Scoring:</strong> Kicktipp points after 90 minutes: 4 exact score, 3 correct goal difference, 2 correct outcome. Wrong and missing tips score 0.</p>
            <p id="footer-meta"></p>
        </div>
    </footer>

<script type="module">
import * as D from '/js/dashboard-data.js'

const VIEWS = [
  { key: 'timeline', label: 'Trend' },
  { key: 'hits', label: 'Hit types' },
  { key: 'recent', label: '<span class="sm:hidden">Matchdays</span><span class="hidden sm:inline">Last matchdays</span>' },
]

let stats
let state
let view
let charts = []
const ui = { tab: 'timeline', timelineMode: 'diff', highlight: null }

const $ = (id) => document.getElementById(id)
const esc = D.escapeHtml

// --- Controls -------------------------------------------------------------------

function tabClasses(active, first, last) {
  return [
    'flex items-center justify-center gap-1 sm:gap-2 px-3 sm:px-4 py-2 sm:py-3 text-sm sm:text-base whitespace-nowrap flex-1 lg:flex-none lg:w-52 transition-all duration-200 border-b-2 tracking-wide font-mono',
    first ? 'rounded-l-md' : '',
    last ? 'rounded-r-md' : '',
    active
      ? 'bg-white dark:bg-gray-800 text-sky-700 dark:text-sky-400 font-semibold border-sky-500 dark:border-sky-400 shadow-md'
      : 'bg-gray-100 dark:bg-slate-900 text-gray-500 dark:text-gray-400 border-transparent hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-sky-700 dark:hover:text-sky-400',
  ].join(' ')
}

// Segmented buttons (season and view switch share one look)
function segmentClasses(active) {
  return `px-3 sm:px-4 py-1.5 text-sm font-mono whitespace-nowrap ${active
    ? 'bg-sky-700 dark:bg-sky-600 text-white font-semibold'
    : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'}`
}

function renderControls() {
  $('league-tabs').innerHTML = D.LEAGUES.map((l, i) => {
    const active = l.value === state.league
    const icon = l.logo
      ? `<img src="${l.logo}" alt="" class="w-6 h-6 object-contain">`
      : '<span class="text-lg" aria-hidden="true">🌍</span>'
    return `<button type="button" role="tab" aria-selected="${active}" data-league="${esc(l.value)}"
      class="${tabClasses(active, i === 0, i === D.LEAGUES.length - 1)}" title="${esc(l.label)}">
      ${icon}<span class="hidden sm:inline-block">${esc(l.label)}</span></button>`
  }).join('')

  const seasons = D.seasonOptions(stats)
  $('season-control').innerHTML = seasons
    .map((s) => {
      const active = s.value === state.season
      return `<button type="button" data-season="${esc(s.value)}" aria-pressed="${active}"
        class="${segmentClasses(active)}">
        ${s.value === 'all' ? 'All seasons' : esc(s.label)}</button>`
    })
    .join('')

  const toggle = (key, label, checked, disabled = false, title = '') =>
    `<label class="inline-flex items-center gap-1.5 ${disabled ? 'opacity-50' : 'cursor-pointer'}" title="${esc(title)}">
      <input type="checkbox" data-toggle="${key}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}
        class="accent-sky-700 w-4 h-4"> ${label}</label>`
  $('toggles').innerHTML = [
    toggle('showAll', 'Show all models', state.showAll, false,
      'Include inactive models and models with fewer than 80% of the matches'),
    toggle('backfill', 'Count backfill tips', state.backfill, !view?.hasBackfill || !!state.fair,
      'Count the tips generated afterwards for late joiners (before their first live run)'),
    toggle('fair', 'Fair comparison', !!state.fair, !view?.fairGroups.length,
      'Only matches offered to every active model'),
  ].join('')

  $('view-tabs').innerHTML = VIEWS.map(
    (v, i) => `<button type="button" role="tab" data-view="${v.key}" aria-selected="${v.key === ui.tab}"
      class="${segmentClasses(v.key === ui.tab)}">${v.label}</button>`
  ).join('')
}

function bindControls() {
  $('league-tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-league]')
    if (b) update({ league: b.dataset.league })
  })
  $('season-control').addEventListener('click', (e) => {
    const b = e.target.closest('[data-season]')
    if (b) update({ season: b.dataset.season })
  })
  $('toggles').addEventListener('change', (e) => {
    const key = e.target.dataset.toggle
    if (key === 'fair') update({ fair: e.target.checked ? 'active' : null })
    else update({ [key]: e.target.checked })
  })
  $('view-tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-view]')
    if (!b) return
    ui.tab = b.dataset.view
    renderControls()
    renderPanel()
  })
}

function update(patch) {
  state = { ...state, ...patch }
  D.writeState(state)
  render()
}

// --- Leaderboard --------------------------------------------------------------------

function modelCell(row) {
  const { info } = row
  const logo = info.logo
    ? `<img src="${info.logo}" alt="" class="w-5 h-5 object-contain shrink-0" loading="lazy">`
    : `<span class="w-5 h-5 shrink-0 inline-flex items-center justify-center text-sm" aria-hidden="true">${info.isFavourite ? '🎲' : '∑'}</span>`
  const tags = []
  if (info.isBaseline) tags.push(`<span class="hidden sm:inline ml-1 px-1.5 rounded bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs font-normal" title="${esc(info.hint)}">Baseline</span>`)
  if (row.backfillTips) tags.push(`<span class="ml-1 px-1 rounded border border-gray-300 dark:border-gray-600 text-xs font-normal text-gray-500 dark:text-gray-400" title="includes ${row.backfillTips} tips generated afterwards">BF</span>`)
  if (row.liveOnly) tags.push('<span class="ml-1 text-xs font-normal text-gray-500 dark:text-gray-400" title="without backfill tips">live</span>')
  if (row.reason) tags.push(`<span class="ml-1 text-xs font-normal italic text-gray-500 dark:text-gray-400">${row.reason}</span>`)
  return `<div class="flex items-center gap-2 min-w-0">${logo}
    <span class="truncate" ${info.hint ? `title="${esc(info.hint)}"` : ''}><span class="sm:hidden">${esc(info.short)}</span><span class="hidden sm:inline">${esc(info.name)}</span></span>${tags.join('')}</div>`
}

function ciCell(row, scale, favAvg) {
  const pos = (v) => `${(((v - scale.min) / (scale.max - scale.min)) * 100).toFixed(2)}%`
  const style = D.modelStyle(row.info)
  const favLine = favAvg != null
    ? `<div class="absolute inset-y-0 border-l border-dashed border-gray-900 dark:border-gray-100 opacity-60" style="left:${pos(favAvg)}" aria-hidden="true"></div>`
    : ''
  return `<div class="relative h-6 w-32 sm:w-44" role="img" aria-label="Avg ${D.fmt(row.avg0)}, 95% interval ${D.fmt(row.ciLow)} to ${D.fmt(row.ciHigh)}">
      <div class="absolute inset-x-0 top-1/2 border-t border-gray-100 dark:border-gray-700"></div>
      ${favLine}
      <div class="absolute top-1/2 -translate-y-1/2 h-1.5 rounded-full opacity-40" style="left:${pos(row.ciLow)};width:calc(${pos(row.ciHigh)} - ${pos(row.ciLow)});background:${style.color}"></div>
      <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3 h-3 rounded-full ring-2 ring-white dark:ring-gray-800" style="left:${pos(row.avg0)};background:${style.color}"></div>
    </div>`
}

function coverageCell(row) {
  if (!row.coverage) return '<span class="text-gray-400">–</span>'
  const c = row.coverage
  const title = c.source === 'live'
    ? `${c.delivered} of ${c.expected} matches tipped before kickoff` +
      (c.runs ? ` · ${c.runs - c.missedRuns} of ${c.runs} runs with tips, ${D.pct(c.runShare)} of the matches per run` : '')
    : `${c.delivered} of ${c.expected} matches tipped`
  const warn = row.lowCoverage
    ? '<span class="text-amber-600 dark:text-amber-400" aria-label="Warning: low coverage">⚠︎</span> '
    : ''
  return `<span title="${esc(title)}">${warn}${D.pct(c.share)}</span>`
}

function formCell(row) {
  if (!row.form) return '<span class="text-gray-400">–</span>'
  const d = row.form.avg0 - row.avg0
  const arrow = Math.abs(d) < 0.05 ? '<span class="text-gray-400" aria-label="same">→</span>'
    : d > 0 ? '<span class="text-green-700 dark:text-green-400" aria-label="better">▲</span>'
    : '<span class="text-red-700 dark:text-red-400" aria-label="worse">▼</span>'
  return `<span title="Avg of the last 5 ${view.slice.timeline.step === 'matchday' ? 'matchdays' : 'weeks'}: ${row.form.points} points from ${row.form.offered} matches">${D.fmt(row.form.avg0)} ${arrow}</span>`
}

function deltaCell(row) {
  if (row.info.isFavourite) return '<span class="text-gray-400">0</span>'
  const cls = row.deltaFav > 0.0005 ? 'text-green-700 dark:text-green-400' : row.deltaFav < -0.0005 ? 'text-red-700 dark:text-red-400' : 'text-gray-500'
  return `<span class="${cls}">${D.fmtSigned(row.deltaFav)}</span>`
}

function renderTable() {
  const rows = view.rows
  const lo = Math.min(...rows.map((r) => r.ciLow))
  const hi = Math.max(...rows.map((r) => r.ciHigh))
  const pad = (hi - lo) * 0.05
  const scale = { min: lo - pad, max: hi + pad }
  const favAvg = view.fav?.avg0
  const standard = view.mode === 'standard'
  const th = (text, title, cls = '') => `<th scope="col" class="px-2 py-2 font-semibold whitespace-nowrap ${cls}" title="${esc(title)}">${text}</th>`
  const stickyBg = 'sticky left-0 z-10'
  const head = `<thead class="bg-gray-100 dark:bg-slate-900 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wide">
    <tr>
      ${th('#', 'Rank among the listed models', `text-right ${stickyBg} bg-gray-100 dark:bg-slate-900`)}
      ${th('Model', '', `text-left ${stickyBg} left-8 sm:left-10 bg-gray-100 dark:bg-slate-900`)}
      ${th('Avg', 'Points per offered match (ranking key)', 'text-right')}
      ${th('± Fav', 'Difference to the odds favourite’s average', 'text-right')}
      ${th('Pts', 'Points', 'text-right')}
      ${th('M', 'Offered matches', 'text-right')}
      ${th('95% interval', 'Confidence interval of Avg; dashed: odds favourite', 'text-left')}
      ${standard ? th('4', 'Exact scores (4 points)', 'text-right') + th('3', 'Correct goal difference (3 points)', 'text-right') + th('2', 'Correct outcome (2 points)', 'text-right') : ''}
      ${th('Cov.', 'Coverage: delivered of expected tips', 'text-right')}
      ${standard ? th('Form', 'Avg over the last 5 matchdays or weeks', 'text-right') : ''}
    </tr></thead>`
  const body = rows.map((row) => {
    const base = row.info.isBaseline
    const muted = !row.listed ? 'opacity-50' : ''
    const rowBg = row.info.isFavourite ? 'bg-sky-50 dark:bg-slate-900' : base ? 'bg-gray-50 dark:bg-gray-800' : 'bg-white dark:bg-gray-800'
    const weight = row.info.isFavourite ? 'font-semibold' : ''
    const td = (content, cls = '') => `<td class="px-2 py-1.5 ${cls}">${content}</td>`
    const hits = standard && row.hits
      ? td(row.hits.exact, 'text-right') + td(row.hits.diff, 'text-right') + td(row.hits.tendency, 'text-right')
      : standard ? td('–', 'text-right') + td('–', 'text-right') + td('–', 'text-right') : ''
    return `<tr class="${rowBg} ${weight} ${base ? 'italic' : ''} border-t border-gray-100 dark:border-gray-700 ${muted}">
      ${td(row.rank ?? '', `text-right font-mono font-bold ${stickyBg} ${rowBg} w-8 sm:w-10`)}
      ${td(modelCell(row), `${stickyBg} left-8 sm:left-10 ${rowBg} max-w-40 sm:max-w-none`)}
      ${td(D.fmt(row.avg0), 'text-right font-bold')}
      ${td(deltaCell(row), 'text-right')}
      ${td(row.points, 'text-right')}
      ${td(row.offered, 'text-right text-gray-500 dark:text-gray-400')}
      ${td(ciCell(row, scale, favAvg))}
      ${hits}
      ${td(coverageCell(row), 'text-right whitespace-nowrap')}
      ${standard ? td(formCell(row), 'text-right whitespace-nowrap') : ''}
    </tr>`
  }).join('')
  $('leaderboard').innerHTML = head + `<tbody>${body}</tbody>`

  const leagueLabel = D.LEAGUES.find((l) => l.value === state.league).label
  const seasonLabel = state.season === 'all' ? 'all seasons' : state.season
  $('table-meta').textContent = `${seasonLabel} · ${leagueLabel} · ${view.mode === 'fair' ? view.fairGroup.fixtures : view.fixtures} matches`

  const hiddenCount = view.hidden.length
  $('table-legend').innerHTML = [
    '<span class="inline-flex items-center gap-1"><span class="inline-block w-3 h-3 rounded-full bg-gray-400"></span> Avg</span> <span class="inline-flex items-center gap-1 ml-2"><span class="inline-block w-6 h-1.5 rounded-full bg-gray-400 opacity-40"></span> 95% interval</span> <span class="inline-flex items-center gap-1 ml-2"><span class="inline-block h-3 border-l border-dashed border-gray-900 dark:border-gray-100"></span> Odds favourite</span>',
    !state.showAll && hiddenCount
      ? `${hiddenCount} more model${hiddenCount === 1 ? '' : 's'} hidden (inactive or under 80% of the matches) – “Show all models”.`
      : '',
  ].filter(Boolean).map((t) => `<p class="mt-1 first:mt-0">${t}</p>`).join('') + glossaryHtml()
}

// Visible explanations of the baselines and every column (tooltips alone do
// not work on phones)
function glossaryHtml() {
  const skip = view.mode === 'standard' ? [] : ['hits', 'form']
  const items = D.GLOSSARY.filter((g) => !skip.includes(g.key))
  return `<h3 class="mt-3 mb-1 font-semibold text-gray-700 dark:text-gray-300">How to read this table</h3>
    <dl class="grid sm:grid-cols-2 gap-x-6 gap-y-1">${items.map((g) => `<div>
      <dt class="inline font-semibold text-gray-700 dark:text-gray-300">${esc(g.term)}:</dt>
      <dd class="inline">${esc(g.text)}${g.key === 'form' ? ' ▲/▼: better/worse than the model’s Avg for the whole selection.' : ''}</dd></div>`).join('')}</dl>`
}

function renderNotes() {
  $('notes').innerHTML = D.notesWithPlaceholder(view).map((n) => `<div ${n.placeholder ? 'aria-hidden="true"' : ''} class="${n.placeholder ? 'invisible ' : ''}flex gap-2 items-start rounded-lg px-3 py-2 text-xs sm:text-sm ${n.kind === 'sample'
    ? 'bg-amber-50 dark:bg-amber-900/30 text-amber-900 dark:text-amber-100 border border-amber-200 dark:border-amber-800'
    : 'bg-sky-50 dark:bg-slate-800 text-sky-900 dark:text-sky-100 border border-sky-200 dark:border-slate-700'}">
    <span aria-hidden="true">${n.kind === 'sample' ? '⚠︎' : 'ℹ︎'}</span><span>${esc(n.text)}</span></div>`).join('')
}

// --- Panels -------------------------------------------------------------------------

function destroyCharts() {
  charts.forEach((c) => c.destroy())
  charts = []
}

function legendHtml(items, interactive = true) {
  return `<div class="flex flex-wrap gap-x-3 gap-y-1 text-xs text-gray-600 dark:text-gray-300 mt-3" ${interactive ? 'data-legend' : ''}>${items
    .map((it) => `<button type="button" data-model="${it.index}" class="inline-flex items-center gap-1.5 rounded px-1 ${ui.highlight === it.index ? 'bg-gray-100 dark:bg-gray-700 font-semibold' : ''}" ${interactive ? '' : 'disabled'}>
      <svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="${it.color}" stroke-width="${Math.min(it.width, 3)}" stroke-dasharray="${it.dash.join(' ')}" stroke-linecap="round"/></svg>${esc(it.label)}</button>`)
    .join('')}</div>`
}

function renderTimeline() {
  const tl = D.timeline(stats, view)
  const diff = ui.timelineMode === 'diff'
  const c = D.chrome()
  const modeButton = (key, label) => `<button type="button" data-mode="${key}" aria-pressed="${ui.timelineMode === key}"
    class="px-3 py-1 text-xs sm:text-sm ${ui.timelineMode === key ? 'bg-sky-700 dark:bg-sky-600 text-white' : 'bg-gray-100 dark:bg-slate-900 text-gray-600 dark:text-gray-300'}">${label}</button>`
  const backfillNote = !state.backfill && view.hasBackfill ? ' The trend always includes the backfill tips.' : ''
  $('panel').innerHTML = `
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
      <h2 class="text-base sm:text-xl font-bold">${diff ? 'Points gap to the odds favourite' : 'Cumulative points'}</h2>
      <div class="inline-flex rounded-md overflow-hidden" role="group">${modeButton('diff', 'Gap to favourite')}${modeButton('total', 'Total points')}</div>
    </div>
    <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mb-3">${diff
      ? 'Above zero: more points than the odds favourite on the same matches since the model’s first tip.'
      : 'Points summed per ' + tl.stepName + '.'}${backfillNote}</p>
    <div class="relative h-72 sm:h-96"><canvas id="timeline-chart" aria-label="Line chart of points over time" role="img"></canvas></div>
    ${legendHtml(tl.series.map((s) => ({ index: s.row.info.index, label: clippedLabel(tl, s, diff), ...D.modelStyle(s.row.info) })))}
    ${formTable()}`

  const datasets = tl.series.map((s) => {
    const st = D.modelStyle(s.row.info)
    const dim = ui.highlight != null && ui.highlight !== s.row.info.index
    return {
      label: s.row.info.short,
      data: diff ? s.diff : s.values,
      borderColor: dim ? c.grid : st.color,
      backgroundColor: st.color,
      borderWidth: ui.highlight === s.row.info.index ? 3 : st.width,
      borderDash: st.dash,
      pointRadius: 0,
      pointHoverRadius: 5,
      pointHitRadius: 8,
      tension: 0,
      spanGaps: false,
      order: s.row.info.isFavourite ? 0 : 1,
    }
  })
  const range = diffRange(tl, diff)
  const chart = new Chart($('timeline-chart'), {
    type: 'line',
    data: { labels: tl.labels, datasets },
    options: {
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 12 } },
        y: {
          grid: { color: (ctx) => (diff && ctx.tick?.value === 0 ? c.axis : c.grid) },
          title: { display: true, text: diff ? 'Points vs. favourite' : 'Points' },
          ...range,
        },
      },
      plugins: {
        tooltip: {
          itemSort: (a, b) => b.parsed.y - a.parsed.y,
          callbacks: {
            title: (items) => tl.longLabels[items[0].dataIndex],
            label: (item) => ` ${item.dataset.label}: ${diff ? D.fmtSigned(item.parsed.y, 0) : item.parsed.y}`,
          },
        },
      },
    },
  })
  charts.push(chart)
  $('panel').querySelector('[role=group]').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mode]')
    if (b) { ui.timelineMode = b.dataset.mode; renderPanel() }
  })
  bindLegend()
}

// In the gap view "Always 2:1" falls far behind and would squash the lines
// that matter; clip the axis to the other series and say so in the legend
function diffRange(tl, diff) {
  if (!diff) return {}
  const values = (pred) => tl.series.filter(pred).flatMap((s) => s.diff).filter((v) => v != null)
  const core = values((s) => s.row.info.id !== 'Always-2:1')
  const all = values(() => true)
  if (!core.length) return {}
  const lo = Math.min(...core), hi = Math.max(...core)
  if (Math.min(...all) >= lo - (hi - lo)) return {}
  const pad = Math.max(2, (hi - lo) * 0.08)
  return { min: Math.floor((lo - pad) / 5) * 5, max: Math.ceil((hi + pad) / 5) * 5 }
}

function clippedLabel(tl, s, diff) {
  if (!diff || !diffRange(tl, diff).min) return s.row.info.short
  const last = s.diff.filter((v) => v != null).at(-1)
  return last < diffRange(tl, diff).min ? `${s.row.info.short} (${D.fmtSigned(last, 0)}, off chart)` : s.row.info.short
}

function formTable() {
  const rows = view.rows.filter((r) => r.form).sort((a, b) => b.form.avg0 - a.form.avg0)
  if (!rows.length || view.mode !== 'standard') return ''
  const unit = view.slice.timeline.step === 'matchday' ? 'matchdays' : 'weeks'
  return `<h3 class="text-sm sm:text-base font-bold mt-6 mb-2">Form table (last 5 ${unit})</h3>
    <div class="overflow-x-auto"><table class="w-full text-xs sm:text-sm tabular-nums">
    <thead class="text-gray-500 dark:text-gray-400 text-xs uppercase"><tr><th class="text-right px-2 py-1">#</th><th class="text-left px-2 py-1">Model</th><th class="text-right px-2 py-1">M</th><th class="text-right px-2 py-1">Pts</th><th class="text-right px-2 py-1">Avg</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="border-t border-gray-100 dark:border-gray-700 ${r.info.isBaseline ? 'italic bg-gray-50 dark:bg-gray-800' : ''} ${r.listed ? '' : 'opacity-50'}">
      <td class="text-right px-2 py-1 font-mono">${i + 1}</td><td class="px-2 py-1">${esc(r.info.name)}</td>
      <td class="text-right px-2 py-1">${r.form.offered}</td><td class="text-right px-2 py-1">${r.form.points}</td><td class="text-right px-2 py-1 font-bold">${D.fmt(r.form.avg0)}</td></tr>`).join('')}</tbody></table></div>`
}

function bindLegend() {
  const legend = $('panel').querySelector('[data-legend]')
  if (!legend) return
  legend.addEventListener('click', (e) => {
    const b = e.target.closest('[data-model]')
    if (!b) return
    const idx = Number(b.dataset.model)
    ui.highlight = ui.highlight === idx ? null : idx
    renderPanel()
  })
}

function renderHits() {
  if (view.mode !== 'standard') {
    $('panel').innerHTML = '<h2 class="text-base sm:text-xl font-bold mb-2">Hit types</h2><p class="text-sm text-gray-500 dark:text-gray-400">Not available in the fair comparison – turn off “Fair comparison”.</p>'
    return
  }
  const rows = view.rows.filter((r) => r.hits)
  const colors = D.hitColors()
  const c = D.chrome()
  $('panel').innerHTML = `
    <h2 class="text-base sm:text-xl font-bold mb-1">Hit types</h2>
    <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mb-2">Share of offered matches; each match counts once, at the best level reached.</p>
    <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-gray-600 dark:text-gray-300 mb-2">${D.HIT_TYPES.map((h) =>
      `<span class="inline-flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-sm border border-gray-300 dark:border-gray-600" style="background:${colors[h.key]}"></span>${h.label}${h.points ? ` (${h.points})` : ''}</span>`).join('')}</div>
    <div class="relative" style="height:${rows.length * 30 + 40}px"><canvas id="hits-chart" role="img" aria-label="Stacked bars of hit types per model"></canvas></div>
    <div class="overflow-x-auto mt-4"><table class="w-full text-xs tabular-nums">
      <caption class="sr-only">Hit types as a table</caption>
      <thead class="text-gray-500 dark:text-gray-400 uppercase"><tr><th class="text-left px-2 py-1">Model</th>${D.HIT_TYPES.map((h) => `<th class="text-right px-2 py-1">${h.label}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r) => `<tr class="border-t border-gray-100 dark:border-gray-700 ${r.listed ? '' : 'opacity-50'}"><td class="px-2 py-1">${esc(r.info.short)}</td>${D.HIT_TYPES.map((h) => `<td class="text-right px-2 py-1">${r.hits[h.key]} <span class="text-gray-400">(${D.pct(r.hits[h.key] / r.offered)})</span></td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>`
  const chart = new Chart($('hits-chart'), {
    type: 'bar',
    data: {
      labels: rows.map((r) => r.info.short),
      datasets: D.HIT_TYPES.map((h) => ({
        label: h.label,
        data: rows.map((r) => (r.hits[h.key] / r.offered) * 100),
        counts: rows.map((r) => r.hits[h.key]),
        backgroundColor: colors[h.key],
        borderColor: c.surface,
        borderWidth: { left: 1, right: 1 },
        borderSkipped: false,
        barThickness: 18,
      })),
    },
    options: {
      indexAxis: 'y',
      scales: {
        x: { stacked: true, max: 100, ticks: { callback: (v) => `${v} %` }, grid: { color: c.grid } },
        y: { stacked: true, grid: { display: false }, ticks: { color: c.text } },
      },
      plugins: {
        tooltip: {
          callbacks: {
            label: (item) => ` ${item.dataset.label}: ${item.dataset.counts[item.dataIndex]} (${D.fmt(item.parsed.x, 1)} %)`,
          },
        },
      },
    },
  })
  charts.push(chart)
}

function pointsBadge(points, backfill) {
  const colors = D.hitColors()
  const key = points === 4 ? 'exact' : points === 3 ? 'diff' : points === 2 ? 'tendency' : 'wrong'
  const dark = D.isDark()
  const light = dark ? key === 'exact' || key === 'diff' : key === 'tendency' || key === 'wrong'
  return `<span class="inline-block min-w-5 text-center rounded px-1 text-xs font-semibold ${light ? 'text-gray-900' : 'text-white'}" style="background:${colors[key]}" title="${points} points${backfill ? ' (backfill tip)' : ''}">${points}</span>`
}

function renderRecent() {
  const recent = D.recentMatchdays(stats, state)
  if (!recent || !recent.matchdays.length) {
    $('panel').innerHTML = '<p class="text-sm text-gray-500">No matchdays available.</p>'
    return
  }
  const models = recent.models
  const head = `<tr><th class="text-left px-2 py-2 sticky left-0 z-10 bg-gray-100 dark:bg-slate-900">Match</th><th class="px-2 py-2">Score</th>${models.map((m) => {
    const st = D.modelStyle(m)
    return `<th class="px-2 py-2 whitespace-nowrap font-semibold" title="${esc(m.name)}"><span class="inline-flex items-center gap-1"><svg width="12" height="6" aria-hidden="true"><line x1="1" y1="3" x2="11" y2="3" stroke="${st.color}" stroke-width="3" stroke-dasharray="${st.dash.join(' ')}" stroke-linecap="round"/></svg>${esc(m.short)}</span></th>`
  }).join('')}</tr>`
  const blocks = recent.matchdays.map((day) => {
    const totals = models.map((_, i) => day.fixtures.reduce((s, f) => s + (f.tips[i]?.points ?? 0), 0))
    const best = Math.max(...totals)
    const rows = day.fixtures.map((f) => `<tr class="border-t border-gray-100 dark:border-gray-700">
      <td class="px-2 py-1.5 sticky left-0 z-10 bg-white dark:bg-gray-800 whitespace-nowrap"><div class="font-medium">${esc(f.home)} – ${esc(f.away)}</div><div class="text-gray-400 text-xs">${esc(D.fmtKickoff(f.kickoff))}</div></td>
      <td class="px-2 py-1.5 text-center font-mono font-bold whitespace-nowrap">${f.homeGoals}:${f.awayGoals}</td>
      ${f.tips.map((t) => `<td class="px-2 py-1.5 text-center whitespace-nowrap">${t ? `<span class="font-mono">${t.home}:${t.away}</span>${t.backfill ? '<sup class="text-gray-400" title="backfill tip">BF</sup>' : ''} ${pointsBadge(t.points, t.backfill)}` : '<span class="text-gray-400" title="no tip">–</span>'}</td>`).join('')}
    </tr>`).join('')
    return `<div class="mb-6 last:mb-0">
      <h3 class="flex items-center gap-2 text-sm sm:text-base font-bold mb-2">${day.league.logo ? `<img src="${day.league.logo}" alt="" class="w-5 h-5 object-contain">` : ''}${esc(day.league.label)} · matchday from ${D.fmtDate(day.date)}</h3>
      <div class="overflow-x-auto"><table class="w-full text-xs sm:text-sm tabular-nums">
        <thead class="bg-gray-100 dark:bg-slate-900 text-gray-500 dark:text-gray-400 text-xs">${head}</thead>
        <tbody>${rows}
          <tr class="border-t-2 border-gray-300 dark:border-gray-600 font-bold"><td class="px-2 py-1.5 sticky left-0 z-10 bg-white dark:bg-gray-800">Points</td><td></td>${totals.map((t) => `<td class="px-2 py-1.5 text-center ${t === best ? 'text-sky-700 dark:text-sky-400' : ''}">${t}${t === best ? ' ★' : ''}</td>`).join('')}</tr>
        </tbody></table></div></div>`
  }).join('')
  const note = recent.otherSeason ? `<p class="text-xs sm:text-sm text-amber-700 dark:text-amber-300 mb-3">Last matchdays exist only for the current season ${recent.season}.</p>` : ''
  const allNote = state.league === 'all' ? '<p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mb-3">The latest matchday per league; pick a league for the last three.</p>' : ''
  $('panel').innerHTML = `<h2 class="text-base sm:text-xl font-bold mb-1">Last matchdays</h2>${note}${allNote}
    <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-gray-600 dark:text-gray-300 mb-3">${[4, 3, 2, 0].map((p) => `<span class="inline-flex items-center gap-1">${pointsBadge(p)} ${D.HIT_TYPES.find((h) => h.points === p).label}</span>`).join('')}</div>
    ${blocks}`
}

function renderPanel() {
  destroyCharts()
  if (ui.tab === 'timeline') renderTimeline()
  else if (ui.tab === 'hits') renderHits()
  else renderRecent()
}

// --- Page -----------------------------------------------------------------------------

function render() {
  view = D.buildView(stats, state)
  renderControls()
  if (!view) {
    $('error').textContent = 'No data for this selection.'
    $('error').classList.remove('hidden')
    return
  }
  $('error').classList.add('hidden')
  renderNotes()
  renderTable()
  renderPanel()
}

async function init() {
  try {
    stats = await D.loadStats()
  } catch (err) {
    console.error('Failed to load stats', err)
    $('error').textContent = 'Failed to load the stats. Please try again later.'
    $('error').classList.remove('hidden')
    document.body.classList.add('loaded')
    return
  }
  state = D.readState(stats)
  D.applyChartDefaults(Chart)
  bindControls()
  render()
  $('footer-meta').textContent = `Updated: ${D.fmtGenerated(stats)} · Results through ${D.fmtDate(stats.meta.data_through)} · ${stats.meta.matches} matches, ${stats.meta.tips} tips`
  D.onSchemeChange(() => { D.applyChartDefaults(Chart); render() })
  document.body.classList.add('loaded')
}

window.addEventListener('load', init)
</script>
</body>
</html>
