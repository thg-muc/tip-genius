            <p class="sm:hidden"><strong class="font-semibold">Scoring:</strong> 4 exact, 3 goal difference, 2 outcome.</p>
            <p class="hidden sm:block"><strong class="font-semibold">Scoring:</strong> Kicktipp points after 90 minutes: 4 exact score, 3 correct goal difference, 2 correct outcome. Wrong and missing tips score 0.</p>

<script type="module">
import * as D from '/js/dashboard-data.js'

const VIEWS = [
  { key: 'timeline', label: 'Trends' },
  { key: 'hits', label: 'Hit types' },
  { key: 'recent', label: '<span class="sm:hidden">Matchdays</span><span class="hidden sm:inline">Last matchdays</span>' },
]

let stats
let state
let view
let charts = []
const ui = { tab: 'timeline', timelineMode: 'diff', highlight: null, glossaryOpen: D.startsExpanded() }

const $ = (id) => document.getElementById(id)
const esc = D.escapeHtml

// --- Controls -------------------------------------------------------------------

function tabClasses(active, first, last) {
  return [
    // Same classes as createTab() in main.js
    'flex items-center justify-center sm:gap-2 px-3 sm:px-4 py-3 sm:py-4 sm:text-lg focus:z-10 flex-1 lg:flex-none lg:w-56 sm:min-w-32 sm:max-w-64 whitespace-nowrap transition-all duration-300 relative border-b-2 tracking-wide font-mono',
    first ? 'rounded-l-md' : '',
    last ? 'rounded-r-md' : '',
    active
      ? 'bg-white dark:bg-gray-800 text-sky-700 dark:text-sky-400 font-semibold border-sky-500 dark:border-sky-400 shadow-md'
      : 'bg-gray-100 dark:bg-slate-900 text-gray-500 dark:text-gray-400 font-normal border-transparent hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-sky-700 dark:hover:text-sky-400 hover:shadow-md hover:-translate-y-0.5',
  ].join(' ')
}

// Segmented buttons (season and view switch share one look)
function segmentClasses(active) {
  return `px-3 sm:px-4 py-1.5 text-sm font-mono whitespace-nowrap ${active
    ? 'bg-sky-700 dark:bg-sky-600 text-white font-semibold'
    : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'}`
}

function renderControls() {
  $('league-tabs').innerHTML = D.LEAGUES.map((l, i) => {
    const active = l.value === state.league
    const icon = l.logo
      ? `<img src="${l.logo}" alt="" class="w-7 h-7 sm:w-6 sm:h-6 object-contain">`
      : '<span class="w-7 h-7 sm:w-6 sm:h-6 inline-flex items-center justify-center text-2xl sm:text-xl leading-none" aria-hidden="true">🌍</span>'
    return `<button type="button" role="tab" aria-selected="${active}" data-league="${esc(l.value)}"
      class="${tabClasses(active, i === 0, i === D.LEAGUES.length - 1)}" title="${esc(l.label)}">
      ${icon}<span class="hidden sm:inline-block">${esc(l.label)}</span></button>`
  }).join('')

  const seasons = D.seasonOptions(stats)
  $('season-control').innerHTML = seasons
    .map((s) => {
      const active = s.value === state.season
      return `<button type="button" data-season="${esc(s.value)}" aria-pressed="${active}"
        class="${segmentClasses(active)}">
        ${s.value === 'all' ? 'All seasons' : esc(s.label)}</button>`
    })
    .join('')

  const toggle = (key, label, checked, disabled = false, title = '') =>
    `<label class="inline-flex items-center gap-1.5 whitespace-nowrap ${disabled ? 'opacity-50' : 'cursor-pointer'}" title="${esc(title)}">
      <input type="checkbox" data-toggle="${key}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}
        class="accent-sky-700 w-4 h-4"> ${label}</label>`
  $('toggles').innerHTML = [
    toggle('backfill', '<span class="sm:hidden">Allow backfill</span><span class="hidden sm:inline">Allow backfill tips</span>', state.fair ? true : state.backfill, !view?.hasBackfill || !!state.fair,
      state.fair
        ? 'The fair comparison always counts backfill tips'
        : 'Count the tips generated afterwards for late joiners (before their first live run)'),
    toggle('fair', 'Fair comparison', !!state.fair, !view?.fairGroups.length,
      'Only matches offered to every active model'),
  ].join('')

  $('view-tabs').innerHTML = VIEWS.map(
    (v, i) => `<button type="button" role="tab" data-view="${v.key}" aria-selected="${v.key === ui.tab}"
      class="${segmentClasses(v.key === ui.tab)}">${v.label}</button>`
  ).join('')
}

function bindControls() {
  $('league-tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-league]')
    if (b) update({ league: b.dataset.league })
  })
  $('season-control').addEventListener('click', (e) => {
    const b = e.target.closest('[data-season]')
    if (b) update({ season: b.dataset.season })
  })
  $('toggles').addEventListener('change', (e) => {
    const key = e.target.dataset.toggle
    if (key === 'fair') update({ fair: e.target.checked ? 'active' : null })
    else update({ [key]: e.target.checked })
  })
  $('view-tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-view]')
    if (!b) return
    ui.tab = b.dataset.view
    setCardOpen('panel-card', true)
    renderControls()
    renderPanel()
  })
}

// Cards fold from their header row: a button inside the heading carries
// aria-expanded, so the heading stays a heading for screen readers. Folded
// cards are remembered per browser; a folded table is re-measured on opening
const CARDS_KEY = 'dashboardFoldedCards'
let foldedCards = {}

function isCardOpen(id) {
  return $(id).dataset.open === 'true'
}

function setCardOpen(id, open, save = true) {
  const card = $(id)
  card.dataset.open = String(open)
  const button = card.querySelector('[data-card-toggle] button')
  button.setAttribute('aria-expanded', String(open))
  $(button.getAttribute('aria-controls')).hidden = !open
  if (save) {
    foldedCards[id] = !open
    try {
      localStorage.setItem(CARDS_KEY, JSON.stringify(foldedCards))
    } catch {
      // Storage can be unavailable (private mode); folding still works
    }
  }
  if (id === 'table-card' && open) alignStickyColumns()
}

function bindCards() {
  try {
    foldedCards = JSON.parse(localStorage.getItem(CARDS_KEY)) || {}
  } catch {
    foldedCards = {}
  }
  for (const id of ['table-card', 'panel-card']) {
    if (foldedCards[id]) setCardOpen(id, false, false)
    $(id).querySelector('[data-card-toggle]').addEventListener('click', () => setCardOpen(id, !isCardOpen(id)))
  }
}

function update(patch) {
  state = { ...state, ...patch }
  ui.highlight = null
  D.writeState(state)
  render()
}

// --- Leaderboard --------------------------------------------------------------------

function modelCell(row) {
  const { info } = row
  const logo = D.modelIconHtml(info)
  const tags = []
  if (info.isBaseline) tags.push(`<span class="hidden sm:inline ml-1 px-1.5 rounded bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs font-normal" title="${esc(info.hint)}">Baseline</span>`)
  if (row.backfillTips) tags.push(`<span class="ml-1 px-1 rounded border border-gray-300 dark:border-gray-600 text-xs font-normal text-gray-500 dark:text-gray-400" title="includes ${row.backfillTips} tips generated afterwards">BF</span>`)
  if (row.liveOnly) tags.push('<span class="ml-1 text-xs font-normal text-gray-500 dark:text-gray-400" title="without backfill tips">live</span>')
  if (row.reason) tags.push(`<span class="ml-1 text-xs font-normal italic text-gray-500 dark:text-gray-400">${row.reason}</span>`)
  return `<div class="flex items-center gap-2 min-w-0">${logo}
    <span class="truncate" ${info.hint ? `title="${esc(info.hint)}"` : ''}>${D.modelNameHtml(info)}</span>${tags.join('')}</div>`
}

function ciCell(row, scale, favAvg) {
  const pos = (v) => `${(((v - scale.min) / (scale.max - scale.min)) * 100).toFixed(2)}%`
  const style = D.modelStyle(row.info)
  const favLine = favAvg != null
    ? `<div class="absolute inset-y-0 border-l border-dashed border-gray-900 dark:border-gray-100 opacity-60" style="left:${pos(favAvg)}" aria-hidden="true"></div>`
    : ''
  return `<div class="relative h-6 w-32 sm:w-44" role="img" aria-label="Avg ${D.fmt(row.avg0)}, 95% interval ${D.fmt(row.ciLow)} to ${D.fmt(row.ciHigh)}">
      <div class="absolute inset-x-0 top-1/2 border-t border-gray-100 dark:border-gray-700"></div>
      ${favLine}
      <div class="absolute top-1/2 -translate-y-1/2 h-1.5 rounded-full opacity-40" style="left:${pos(row.ciLow)};width:calc(${pos(row.ciHigh)} - ${pos(row.ciLow)});background:${style.color}"></div>
      <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3 h-3 rounded-full ring-2 ring-white dark:ring-gray-800" style="left:${pos(row.avg0)};background:${style.color}"></div>
    </div>`
}

function coverageCell(row) {
  if (!row.coverage) return '<span class="text-gray-500 dark:text-gray-400">–</span>'
  const c = row.coverage
  const title = c.source === 'live'
    ? `${c.delivered} of ${c.expected} matches tipped before kickoff` +
      (c.runs ? ` · ${c.runs - c.missedRuns} of ${c.runs} runs with tips, ${D.pct(c.runShare)} of the matches per run` : '')
    : `${c.delivered} of ${c.expected} matches tipped`
  const warn = row.lowCoverage
    ? '<span class="text-amber-600 dark:text-amber-400" aria-label="Warning: low coverage">⚠︎</span> '
    : ''
  const digits = row.lowCoverage && c.share >= 0.895 ? 1 : 0
  return `<span title="${esc(title)}">${warn}${D.pct(c.share, digits)}</span>`
}

function formCell(row) {
  if (!row.form) return '<span class="text-gray-500 dark:text-gray-400">–</span>'
  // Form always includes backfill tips; a live-only Avg is no fair base for the arrow
  const d = row.form.avg0 - row.avg0
  const arrow = row.liveOnly ? '<span class="text-gray-500 dark:text-gray-400" title="form includes backfill tips">·</span>'
    : Math.abs(d) < 0.05 ? '<span class="text-gray-500 dark:text-gray-400" aria-label="same">→</span>'
    : d > 0 ? '<span class="text-green-700 dark:text-green-400" aria-label="better">▲</span>'
    : '<span class="text-red-700 dark:text-red-400" aria-label="worse">▼</span>'
  return `<span title="Avg of the last 5 ${D.formUnit(state)}: ${row.form.points} points from ${row.form.offered} matches">${D.fmt(row.form.avg0)} ${arrow}</span>`
}

function deltaCell(row) {
  if (row.info.isFavourite) return '<span class="text-gray-500 dark:text-gray-400" title="reference">–</span>'
  const cls = row.deltaFav > 0.0005 ? 'text-green-700 dark:text-green-400' : row.deltaFav < -0.0005 ? 'text-red-700 dark:text-red-400' : 'text-gray-500'
  return `<span class="${cls}">${D.fmtSigned(row.deltaFav)}</span>`
}

function renderTable() {
  const rows = view.rows
  const lo = Math.min(...rows.map((r) => r.ciLow))
  const hi = Math.max(...rows.map((r) => r.ciHigh))
  // A zero span (every interval empty) would divide by zero in ciCell
  const pad = hi > lo ? (hi - lo) * 0.05 : 0.1
  const scale = { min: lo - pad, max: hi + pad }
  const favAvg = view.fav?.avg0
  const standard = view.mode === 'standard'
  const th = (text, title, cls = '') => `<th scope="col" class="px-2 py-2 font-semibold whitespace-nowrap ${cls}" title="${esc(title)}">${text}</th>`
  const stickyBg = 'sticky left-0 z-10'
  const head = `<thead class="bg-gray-100 dark:bg-slate-900 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wide">
    <tr>
      ${th('#', 'Rank among the listed models', `text-right ${stickyBg} bg-gray-100 dark:bg-slate-900`)}
      ${th('Model', '', `text-left ${stickyBg} bg-gray-100 dark:bg-slate-900`)}
      ${th('Avg', 'Points per offered match (ranking key)', 'text-right')}
      ${th('± Fav', 'Difference to the Avg of Favourite 2:1', 'text-right')}
      ${th('Pts', 'Points', 'text-right')}
      ${th('M', 'Offered matches', 'text-right')}
      ${th('95% interval', 'Confidence interval of Avg; dashed: Favourite 2:1', 'text-left')}
      ${standard ? th('4', 'Exact scores (4 points)', 'text-right') + th('3', 'Correct goal difference (3 points)', 'text-right') + th('2', 'Correct outcome (2 points)', 'text-right') : ''}
      ${th('Cov.', 'Coverage: delivered of expected tips', 'text-right')}
      ${standard ? th('Form', 'Avg over the last 5 matchdays or weeks', 'text-right') : ''}
    </tr></thead>`
  const body = rows.map((row) => {
    const base = row.info.isBaseline
    const muted = !row.listed ? 'opacity-50' : ''
    const rowBg = row.info.isFavourite ? 'bg-sky-50 dark:bg-slate-900' : base ? 'bg-gray-50 dark:bg-gray-800' : 'bg-white dark:bg-gray-800'
    const weight = row.info.isFavourite ? 'font-semibold' : ''
    const td = (content, cls = '') => `<td class="px-2 py-1.5 ${cls}">${content}</td>`
    const hits = standard && row.hits
      ? td(row.hits.exact, 'text-right') + td(row.hits.diff, 'text-right') + td(row.hits.tendency, 'text-right')
      : standard ? td('–', 'text-right') + td('–', 'text-right') + td('–', 'text-right') : ''
    return `<tr class="${rowBg} ${weight} ${base ? 'italic' : ''} border-t border-gray-100 dark:border-gray-700 ${muted}">
      ${td(row.rank ?? '', `text-right font-mono font-bold ${stickyBg} ${rowBg} w-8 sm:w-10`)}
      ${td(modelCell(row), `${stickyBg} ${rowBg}`)}
      ${td(D.fmt(row.avg0), 'text-right font-bold')}
      ${td(deltaCell(row), 'text-right')}
      ${td(row.points, 'text-right')}
      ${td(row.offered, 'text-right text-gray-500 dark:text-gray-400')}
      ${td(ciCell(row, scale, favAvg))}
      ${hits}
      ${td(coverageCell(row), 'text-right whitespace-nowrap')}
      ${standard ? td(formCell(row), 'text-right whitespace-nowrap') : ''}
    </tr>`
  }).join('')
  $('leaderboard').innerHTML = head + `<tbody>${body}</tbody>`
  alignStickyColumns()

  const leagueLabel = D.LEAGUES.find((l) => l.value === state.league).label
  const seasonLabel = state.season === 'all' ? 'all seasons' : state.season
  $('table-meta').textContent = `${seasonLabel} · ${leagueLabel} · ${view.mode === 'fair' ? view.fairGroup.fixtures : view.fixtures} matches`

  const hiddenCount = view.hidden.length
  $('table-legend').innerHTML = [
    hiddenCount ? hiddenModelsNote(hiddenCount) : '',
  ].filter(Boolean).map((t) => `<p class="mt-1 first:mt-0">${t}</p>`).join('') + glossaryHtml()
}

// Under the table, the switch for models that do not count for the ranking
// (inactive or under 80% of the matches): shown greyed out or hidden
function hiddenModelsNote(count) {
  const models = `model${count === 1 ? '' : 's'}`
  const reason = '<span class="hidden sm:inline"> (inactive or under 80% of the matches)</span>'
  const link = (show, label) =>
    `<button type="button" data-show-all="${show ? '1' : '0'}" class="font-semibold text-sky-700 dark:text-sky-400 hover:underline">${label}</button>`
  return state.showAll
    ? `${count} unranked ${models} shown${reason} · ${link(false, 'Hide unranked')}`
    : `${count} unranked ${models} hidden${reason} · ${link(true, 'Show unranked')}`
}

// The Model column sticks right of the rank column; its offset is the rank
// column's rendered width, which depends on table layout, not a fixed class.
// When the table is wider than the screen (phones), the Model column gets the
// room left once the columns up to M fit, so names are not cut short and the
// interval and later columns sit behind a horizontal scroll
const LAST_VISIBLE_COLUMN = 5 // '#', Model, Avg, ± Fav, Pts, M

function alignStickyColumns() {
  const table = $('leaderboard')
  const box = table.parentElement
  const heads = [...table.querySelectorAll('thead th')]
  if (!heads.length || !isCardOpen('table-card')) return
  const modelCells = table.querySelectorAll('tr > :nth-child(2)')
  // An overflowing table shrinks every column to its minimum and ignores cell
  // widths, so the width goes on the cell's content as a minimum instead
  const contents = table.querySelectorAll('tbody tr > :nth-child(2) > div')
  contents.forEach((div) => (div.style.minWidth = ''))
  if (table.scrollWidth > box.clientWidth + 1) {
    const others = heads
      .slice(0, LAST_VISIBLE_COLUMN + 1)
      .reduce((sum, th, i) => (i === 1 ? sum : sum + th.getBoundingClientRect().width), 0)
    const cell = heads[1]
    const padding = parseFloat(getComputedStyle(cell).paddingLeft) + parseFloat(getComputedStyle(cell).paddingRight)
    const width = Math.max(96, Math.floor(box.clientWidth - others)) - padding
    contents.forEach((div) => (div.style.minWidth = `${width}px`))
  }
  const left = `${heads[0].getBoundingClientRect().width}px`
  modelCells.forEach((cell) => (cell.style.left = left))
}

// Visible explanations of the baselines and every column (tooltips alone do
// not work on phones)
function glossaryHtml() {
  const skip = view.mode === 'standard' ? [] : ['hits', 'form']
  const items = D.GLOSSARY.filter((g) => !skip.includes(g.key))
  // Collapsible, closed on phones; ui.glossaryOpen keeps the choice across re-renders
  return `<details id="glossary" class="mt-3" ${ui.glossaryOpen ? 'open' : ''}>
    <summary class="cursor-pointer mb-1 font-semibold text-gray-700 dark:text-gray-300">How to read this table</summary>
    <dl class="grid sm:grid-cols-2 gap-x-6 gap-y-1">${items.map((g) => `<div>
      <dt class="inline font-semibold text-gray-700 dark:text-gray-300">${esc(g.term)}:</dt>
      <dd class="inline">${esc(g.text)}${g.key === 'form' ? ' ▲/▼: better/worse than the model’s Avg for the whole selection.' : ''}</dd></div>`).join('')}</dl>
  </details>`
}

function renderNotes() {
  $('notes').innerHTML = D.notesWithPlaceholder(view).map((n) => `<div ${n.placeholder ? 'aria-hidden="true"' : ''} class="${n.placeholder ? 'invisible ' : ''}flex gap-2 items-center rounded-lg px-3 py-1 text-xs sm:text-sm ${n.kind === 'sample'
    ? 'bg-amber-50 dark:bg-amber-900/30 text-amber-900 dark:text-amber-100 border border-amber-200 dark:border-amber-800'

function legendHtml(items) {

function renderTimeline() {
  const tl = D.timeline(stats, view)

  const c = D.chrome()
  // A switch inside the panel, deliberately unlike the view tabs above:

  }
  const backfillNote = !state.backfill && view.hasBackfill ? ' The trend always includes the backfill tips.' : ''
  const range = diffRange(tl, diff)
  $('panel').innerHTML = `
    <div class="flex flex-wrap items-center justify-between gap-x-2 gap-y-3 mb-3 sm:mb-2">
      <h3 class="text-sm sm:text-base font-semibold">${diff ? 'Points gap to Favourite 2:1' : 'Cumulative points'}</h3>
      <div class="grid grid-cols-2 w-full sm:w-auto p-0.5 rounded-lg bg-gray-100 dark:bg-slate-900" role="group">${modeButton('diff', 'Gap to favourite')}${modeButton('total', 'Total points')}</div>
    </div>

      ? 'Above zero: more points than Favourite 2:1 on the same matches since the model’s first tip.'
      : 'Points summed per ' + tl.stepName + '.'}</span>${backfillNote}</p>
    <div class="relative h-72 sm:h-96"><canvas id="timeline-chart" aria-label="Line chart of points over time" role="img"></canvas></div>
    ${legendHtml(tl.series.map((s) => ({ index: s.row.info.index, info: s.row.info, ...D.modelStyle(s.row.info) })))}
    ${formTable()}`

  const datasets = tl.series.map((s) => {
    const st = D.modelStyle(s.row.info)
    const dim = ui.highlight != null && ui.highlight !== s.row.info.index
    return {
      label: s.row.info.short,
      data: diff ? s.diff : s.values,
      borderColor: dim ? c.grid : st.color,
      backgroundColor: st.color,
      borderWidth: ui.highlight === s.row.info.index ? 3 : st.width,
      borderDash: st.dash,
      pointRadius: 0,
      pointHoverRadius: 5,
      pointHitRadius: 8,
      tension: 0,
      spanGaps: false,
      order: s.row.info.isFavourite ? 0 : 1,
    }
  })
  if (!chartsMissing('timeline-chart')) charts.push(new Chart($('timeline-chart'), {
    type: 'line',
    data: { labels: tl.labels, datasets },
    options: {
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 12 } },
        y: {
          grid: { color: (ctx) => (diff && ctx.tick?.value === 0 ? c.axis : c.grid) },
          title: { display: true, text: diff ? 'Points vs. favourite' : 'Points' },
          ...range,
        },
      },
      plugins: {
        tooltip: {
          itemSort: (a, b) => b.parsed.y - a.parsed.y,
          callbacks: {
            title: (items) => tl.longLabels[items[0].dataIndex],
            label: (item) => ` ${item.dataset.label}: ${diff ? D.fmtSigned(item.parsed.y, 0) : item.parsed.y}`,
          },
        },
      },
    },
  }))
  $('panel').querySelector('[role=group]').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mode]')
    if (b) { ui.timelineMode = b.dataset.mode; renderPanel() }
  })
  bindLegend()
}

// In the gap view "Always 2:1" falls far behind and would squash the lines
// that matter; clip the axis to the other series (its line runs off the bottom)
function diffRange(tl, diff) {
  if (!diff) return {}
  const values = (pred) => tl.series.filter(pred).flatMap((s) => s.diff).filter((v) => v != null)
  const core = values((s) => s.row.info.id !== 'Always-2:1')
  const all = values(() => true)
  if (!core.length) return {}
  const lo = Math.min(...core), hi = Math.max(...core)
  if (Math.min(...all) >= lo - (hi - lo)) return {}
  const pad = Math.max(2, (hi - lo) * 0.08)
  return { min: Math.floor((lo - pad) / 5) * 5, max: Math.ceil((hi + pad) / 5) * 5 }
}

function formTable() {
  const rows = view.rows.filter((r) => r.form).sort((a, b) => b.form.avg0 - a.form.avg0)
  if (!rows.length || view.mode !== 'standard') return ''
  const unit = D.formUnit(state)
  return `<h3 class="text-sm sm:text-base font-bold mt-6 mb-2">Form table (last 5 ${unit})</h3>
    <div class="overflow-x-auto"><table class="w-full text-xs sm:text-sm tabular-nums">
    <thead class="text-gray-500 dark:text-gray-400 text-xs uppercase"><tr><th class="text-right px-2 py-1">#</th><th class="text-left px-2 py-1">Model</th><th class="text-right px-2 py-1">M</th><th class="text-right px-2 py-1">Pts</th><th class="text-right px-2 py-1">Avg</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="border-t border-gray-100 dark:border-gray-700 ${r.info.isBaseline ? 'italic bg-gray-50 dark:bg-gray-800' : ''} ${r.listed ? '' : 'opacity-50'}">
      <td class="text-right px-2 py-1 font-mono">${i + 1}</td><td class="px-2 py-1">${D.modelLabelHtml(r.info)}</td>

}

function bindLegend() {
  const legend = $('panel').querySelector('[data-legend]')
  if (!legend) return
  legend.addEventListener('click', (e) => {
    const b = e.target.closest('[data-model]')
    if (!b) return
    const idx = Number(b.dataset.model)
    ui.highlight = ui.highlight === idx ? null : idx
    renderPanel()
  })
}

function renderHits() {

    $('panel').innerHTML = '<p class="text-sm text-gray-500 dark:text-gray-400">Not available in the fair comparison – turn off “Fair comparison”.</p>'
    return

  $('panel').innerHTML = `

    <div class="flex flex-wrap justify-between sm:justify-start gap-x-2 sm:gap-x-4 gap-y-1 text-xs text-gray-600 dark:text-gray-300 mt-3 mb-5 sm:mt-0 sm:mb-2">${D.HIT_TYPES.map((h) =>

      <tbody>${rows.map((r) => `<tr class="border-t border-gray-100 dark:border-gray-700 ${r.listed ? '' : 'opacity-50'}"><td class="px-2 py-1 whitespace-nowrap">${D.modelLabelHtml(r.info, { size: 'w-4 h-4' })}</td>${D.HIT_TYPES.map((h) => `<td class="text-right px-2 py-1">${r.hits[h.key]} <span class="text-gray-500 dark:text-gray-400">(${D.pct(r.hits[h.key] / r.offered)})</span></td>`).join('')}</tr>`).join('')}</tbody>

    options: {
      indexAxis: 'y',
      scales: {
        x: { stacked: true, max: 100, ticks: { callback: (v) => `${v} %` }, grid: { color: c.grid } },
        y: { stacked: true, grid: { display: false }, ticks: { color: c.text }, afterFit: (scale) => { scale.width += ICON_ROOM } },
      },
      plugins: {
        rowIcons: { infos: rows.map((r) => r.info) },
        tooltip: {
          callbacks: {
            label: (item) => ` ${item.dataset.label}: ${item.dataset.counts[item.dataIndex]} (${D.fmt(item.parsed.x, 1)} %)`,
          },

// Without Chart.js (CDN blocked) a chart becomes a short note; tables still work
function chartsMissing(canvasId) {
  if (window.Chart) return false
  $(canvasId).parentElement.outerHTML =
    '<p class="text-sm text-gray-500 dark:text-gray-400 text-center py-8">The chart could not be loaded.</p>'
  return true
}

// Draws each row's logo (or baseline symbol) left of its label on the y axis,
// so chart rows look like the table rows. The axis is widened by ICON_ROOM
// (afterFit) and the icon placed from the label position Chart.js reports
const ICON_SIZE = 16
const ICON_SPACE = 6
const ICON_ROOM = ICON_SIZE + ICON_SPACE
const rowIconsPlugin = {
  id: 'rowIcons',
  afterDraw(chart, _args, opts) {
    const scale = chart.scales.y
    const { ctx } = chart
    const font = Chart.helpers.toFont(scale.options.ticks.font)
    const items = scale.getLabelItems()
    ctx.save()
    ctx.font = font.string
    opts.infos.forEach((info, i) => {
      const item = items[i]
      if (!item) return
      const label = chart.data.labels[i]
      const [textX, y] = item.options.translation
      // Labels of a left y axis are right-aligned at textX
      const x = textX - ctx.measureText(label).width - ICON_SPACE - ICON_SIZE
      const image = D.modelIconImage(info)
      if (image && !image.complete) redrawWhenLoaded(chart, image)
      if (image && image.complete && image.naturalWidth) {
        ctx.drawImage(image, x, y - ICON_SIZE / 2, ICON_SIZE, ICON_SIZE)
      } else if (info.icon) {
        ctx.font = `${ICON_SIZE - 2}px ${font.family}`
        ctx.textBaseline = 'middle'
        ctx.fillText(info.icon, x, y + 1)
        ctx.font = font.string
      }
    })
    ctx.restore()
  },
}

const waitingImages = new WeakMap() // chart -> images it waits for

function redrawWhenLoaded(chart, image) {
  let images = waitingImages.get(chart)
  if (!images) waitingImages.set(chart, (images = new Set()))
  if (images.has(image)) return
  images.add(image)
  // A destroyed chart has no context any more
  image.addEventListener('load', () => chart.ctx && chart.draw(), { once: true })
}

function pointsBadge(points, backfill) {
  const colors = D.hitColors()
  const key = points === 4 ? 'exact' : points === 3 ? 'diff' : points === 2 ? 'tendency' : 'wrong'
  const dark = D.isDark()
  const light = dark ? key === 'exact' || key === 'diff' : key === 'tendency' || key === 'wrong'
  return `<span class="inline-block min-w-5 text-center rounded px-1 text-xs font-semibold ${light ? 'text-gray-900' : 'text-white'}" style="background:${colors[key]}" title="${points} points${backfill ? ' (backfill tip)' : ''}">${points}</span>`
}

function renderRecent() {
  const recent = D.recentMatchdays(stats, state)
  if (!recent || !recent.matchdays.length) {
    $('panel').innerHTML = '<p class="text-sm text-gray-500">No matchdays available.</p>'
    return
  }
  const models = recent.models
  const head = `<tr><th class="text-left px-2 py-2 sticky left-0 z-10 bg-gray-100 dark:bg-slate-900">Match</th><th class="px-1 py-2">Score</th>${models.map((m) => {
    return `<th class="px-1 py-2 whitespace-nowrap font-semibold ${m.isBaseline ? 'italic' : ''}" title="${esc(m.name)}"><span class="flex flex-col items-center gap-1">${D.modelIconHtml(m)}${esc(m.short)}</span></th>`
  }).join('')}</tr>`
  const blocks = recent.matchdays.map((day) => {
    const totals = models.map((_, i) => day.fixtures.reduce((s, f) => s + (f.tips[i]?.points ?? 0), 0))
    const top = Math.max(...totals)
    // No star when nobody scored or every model is level
    const best = top > 0 && totals.some((t) => t !== top) ? top : null
    const rows = day.fixtures.map((f) => `<tr class="border-t border-gray-100 dark:border-gray-700">
      <td class="px-2 py-1.5 sticky left-0 z-10 bg-white dark:bg-gray-800 min-w-32 max-w-56"><div class="font-medium">${esc(f.home)} – ${esc(f.away)}</div><div class="text-gray-500 dark:text-gray-400 text-xs">${esc(D.fmtKickoff(f.kickoff))}</div></td>
      <td class="px-1 py-1.5 text-center font-mono font-bold whitespace-nowrap">${f.homeGoals}:${f.awayGoals}</td>
      ${f.tips.map((t) => `<td class="px-1 py-1.5 text-center whitespace-nowrap">${t ? `<span class="font-mono">${t.home}:${t.away}</span>${t.backfill ? '<sup class="text-gray-500 dark:text-gray-400" title="backfill tip">BF</sup>' : ''} ${pointsBadge(t.points, t.backfill)}` : '<span class="text-gray-500 dark:text-gray-400" title="no tip">–</span>'}</td>`).join('')}
    </tr>`).join('')
    return `<div class="mb-6 last:mb-0">
      <h3 class="flex items-center gap-2 text-sm sm:text-base font-bold mb-2">${day.league.logo ? `<img src="${day.league.logo}" alt="" class="w-5 h-5 object-contain">` : ''}${esc(day.league.label)} · matchday from ${D.fmtDate(day.date)}</h3>
      <div class="overflow-x-auto"><table class="w-full text-xs sm:text-sm tabular-nums">
        <thead class="bg-gray-100 dark:bg-slate-900 text-gray-500 dark:text-gray-400 text-xs">${head}</thead>
        <tbody>${rows}
          <tr class="border-t-2 border-gray-300 dark:border-gray-600 font-bold"><td class="px-2 py-1.5 sticky left-0 z-10 bg-white dark:bg-gray-800">Points</td><td></td>${totals.map((t) => `<td class="px-1 py-1.5 text-center ${t === best ? 'text-sky-700 dark:text-sky-400' : ''}">${t}${t === best ? ' ★' : ''}</td>`).join('')}</tr>
        </tbody></table></div></div>`
  }).join('')
  const note = recent.otherSeason ? `<p class="text-xs sm:text-sm text-amber-700 dark:text-amber-300 mb-3">Last matchdays exist only for the current season ${recent.season}.</p>` : ''
  const allNote = state.league === 'all' ? '<p class="hidden sm:block text-xs sm:text-sm text-gray-500 dark:text-gray-400 mb-3">The latest matchday per league; pick a league for the last three.</p>' : ''
  $('panel').innerHTML = `${note}${allNote}
    <div class="flex flex-wrap justify-between sm:justify-start gap-x-4 gap-y-1 text-xs text-gray-600 dark:text-gray-300 mt-3 mb-5 sm:mt-0 sm:mb-3">${[4, 3, 2, 0].map((p) => `<span class="${p ? 'inline-flex' : 'hidden sm:inline-flex'} items-center gap-1">${pointsBadge(p)} ${D.HIT_TYPES.find((h) => h.points === p).label}</span>`).join('')}</div>
    ${blocks}`
}

const VIEW_TITLES = { timeline: 'Trends', hits: 'Hit types', recent: 'Last matchdays' }

function renderPanel() {
  $('panel-title').textContent = VIEW_TITLES[ui.tab]
  destroyCharts()
  if (ui.tab === 'timeline') renderTimeline()
  else if (ui.tab === 'hits') renderHits()
  else renderRecent()
}

// --- Page -----------------------------------------------------------------------------

function render() {
  view = D.buildView(stats, state)
  renderControls()
  for (const id of ['table-card', 'view-switch', 'panel-card']) $(id).classList.toggle('hidden', !view)
  if (!view) {
    destroyCharts()
    $('notes').innerHTML = ''
    $('error').textContent = 'No data for this selection yet.'
    $('error').classList.remove('hidden')
    return
  }
  $('error').classList.add('hidden')
  renderNotes()
  renderTable()
  renderPanel()
}

async function init() {
  try {
    stats = await D.loadStats()
  } catch (err) {
    console.error('Failed to load stats', err)
    $('error').textContent = 'Failed to load the stats. Please try again later.'
    $('error').classList.remove('hidden')
    document.body.classList.add('loaded')
    return
  }
  try {
    state = D.readState(stats)
    if (window.Chart) D.applyChartDefaults(Chart)
    bindControls()
    bindCards()
    render()
    $('footer-meta').innerHTML = D.footerMetaHtml(stats)
    $('currentYear').textContent = new Date().getFullYear()
  } catch (err) {
    console.error('Failed to render the stats', err)
    $('error').textContent = 'The stats could not be shown. Please try again later.'
    $('error').classList.remove('hidden')
    document.body.classList.add('loaded')
    return
  }
  D.onSchemeChange(() => {
    if (window.Chart) D.applyChartDefaults(Chart)
    render()
  })
  window.addEventListener('resize', alignStickyColumns)
  // Chart labels switch between short and full names at the phone breakpoint
  D.onPhoneChange(() => {
    if (ui.tab === 'hits') renderPanel()
  })
  // 'toggle' does not bubble, so listen in the capture phase
  $('table-legend').addEventListener('toggle', (e) => {
    if (e.target.id === 'glossary') ui.glossaryOpen = e.target.open
  }, true)
  // The Show all / Hide greyed out link under the table
  $('table-legend').addEventListener('click', (e) => {
    const link = e.target.closest('[data-show-all]')
    if (link) update({ showAll: link.dataset.showAll === '1' })
  })
  document.body.classList.add('loaded')
}

// Module scripts run after the deferred Chart.js script, so there is no need to
// wait for every image; fall back to 'load' if the CDN script is still missing
if (window.Chart) init()
else window.addEventListener('load', init)
</script>
</body>
</html>
