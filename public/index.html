<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <!-- Basic meta tags for character encoding and viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- iOS specific meta tags for PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tip Genius">
    <!-- Theme color meta tags for light/dark mode -->
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <!-- SEO meta tags -->
    <meta name="description" content="Making you look like a soccer expert, one AI tip at a time...">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- PWA assets -->
    <link rel="apple-touch-icon" href="images/icon-256x256.png">
    <title>The Tip Genius</title>
    <link rel="manifest" href="manifest.json">
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽️</text></svg>">
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/css/tailwind.css">
    <!-- Prefetch the other page on hover, so the switch is instant (Chromium only) -->
    <script type="speculationrules">{"prefetch": [{"urls": ["/dashboard"], "eagerness": "moderate"}]}</script>
</head>

<body class="font-sans flex flex-col min-h-screen bg-gradient-to-br from-slate-100 to-slate-300 dark:from-slate-900 dark:to-blue-950">
    <!-- Sticky header with navigation -->
    <header class="bg-white bg-opacity-80 dark:bg-gray-800 dark:bg-opacity-80 backdrop-blur-md shadow-md sticky top-0 z-30 mb-3 sm:mb-6">
        <div class="container mx-auto px-4 py-2 sm:py-3">
            <div class="flex items-center justify-between">
                <!-- Logo and site title -->
                <a href="#about" class="flex items-center group transition duration-200">
                    <span class="text-base sm:text-2xl mr-2 hover:animate-bounce">⚽️</span>
                    <span class="text-base sm:text-2xl font-bold text-gray-800 dark:text-gray-200 sm:hover:text-sky-700 dark:hover:text-sky-400 transition duration-200">Tip Genius</span>
                </a>
                <!-- Header right section: the switch to the stats page and the LLM menu (GitHub is linked from the stats page) -->
                <div class="flex items-center gap-1 sm:gap-2">
                    <!-- Switch to the statistics page (/dashboard, rewritten to dashboard.html in vercel.json) -->
                    <a href="/dashboard" class="w-20 sm:w-24 h-10 inline-flex items-center gap-1.5 pl-4 pr-1 sm:pl-6 text-sm sm:text-base text-gray-500 dark:text-gray-400 hover:text-sky-700 dark:hover:text-sky-400 transition duration-200"><svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M3 20h18"/></svg>Stats</a>
                    <!-- LLM Logo Button (replaces Hamburger button); fixed slot width so the
                         Stats link sits where the stats page puts its Tips link -->
                    <div class="relative w-12 sm:w-16 flex justify-end">
                        <button id="menuButton" class="flex items-center p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition duration-200" aria-label="Select LLM provider">
                            <!-- LLM Logo will be inserted here dynamically -->
                            <div id="activeLlmLogo" class="w-6 h-6 flex items-center justify-center">
                                <!-- Fallback to a loading indicator until the logo is loaded -->
                                <svg class="animate-spin w-4 h-4 text-gray-500 dark:text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </div>
                            <script>
                                // The logo main.js showed last time, if it is still the model it
                                // will pick (chosen in the menu, or this session's random pick)
                                ;(() => {
                                    try {
                                        const logo = JSON.parse(localStorage.getItem('activeLlmLogo'))
                                        const current = localStorage.getItem('lastUsedLLM') || sessionStorage.getItem('sessionLLM')
                                        if (!logo || logo.value !== current) return
                                        const img = document.createElement('img')
                                        img.src = logo.src
                                        img.alt = logo.alt
                                        img.className = 'w-6 h-6 object-contain'
                                        document.getElementById('activeLlmLogo').replaceChildren(img)
                                    } catch {}
                                })()
                            </script>
                            <!-- Dropdown indicator -->
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-2 sm:h-4 w-2 sm:w-4 sm:ml-1 text-gray-500 dark:text-gray-400 " fill="none" viewBox="0 0 24 24" stroke="currentColor">

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <!-- Dropdown menu -->
                        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-72 bg-gray-50 dark:bg-gray-700 border border-slate-300 dark:border-slate-500 rounded-lg shadow-lg z-50">
                            <div class="p-6">
                                <h3 class="text-base sm:text-lg font-bold text-gray-800 dark:text-gray-200 mb-3">Large Language Model</h3>
                                <div id="llm-providers" class="space-y-3">
                                    <!-- LLM provider options will be dynamically inserted here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-1 flex-grow">
        <!-- Page title and description -->
        <div class="text-center mb-4 sm:mb-8">
            <h1 class="text-2xl sm:text-4xl font-bold tracking-wide text-gray-800 dark:text-gray-200 mb-2">The Tip Genius</h1>
            <p class="text-gray-500 dark:text-gray-400 text-xs sm:text-xl italic">Making you look like a soccer expert, one AI tip at a time...</p>
        </div>

        <!-- Dynamic content containers -->
        <div class="flex justify-center mb-4">
            <!-- Full width up to four w-56 tabs (max-w-4xl); the stats page uses the same width -->
            <div class="w-full lg:max-w-4xl flex shadow-md rounded-md overflow-hidden">
                <!-- The league tabs are static (part of the first paint, so the bar does not pop in);
                     the active look comes from the aria-selected:* classes, so marking a tab is one
                     attribute (the script below, then setActiveTab() in main.js). The stats page has
                     the same bar with an extra "All leagues" tab -->
                <div id="league-tabs" class="flex w-full" role="tablist" aria-label="League">
                    <button type="button" role="tab" aria-selected="false" id="tab-premier-league---england" class="flex items-center justify-center sm:gap-2 px-3 sm:px-4 py-3 sm:py-4 sm:text-lg focus:z-10 flex-1 lg:flex-none lg:w-56 sm:min-w-32 sm:max-w-64 transition-all duration-300 relative border-b-2 tracking-wide font-mono rounded-l-md bg-gray-100 dark:bg-slate-900 text-gray-500 dark:text-gray-400 font-normal border-transparent hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-sky-700 dark:hover:text-sky-400 hover:shadow-md hover:-translate-y-0.5 aria-selected:bg-white dark:aria-selected:bg-gray-800 aria-selected:text-sky-700 dark:aria-selected:text-sky-400 aria-selected:font-semibold aria-selected:border-sky-500 dark:aria-selected:border-sky-400 aria-selected:shadow-md"><img src="/images/leagues/PremierLeague-England.png" alt="Premier League - England logo" class="w-7 h-7 sm:w-6 sm:h-6 object-contain"><span class="hidden sm:inline-block">Premier League</span></button>
                    <button type="button" role="tab" aria-selected="false" id="tab-bundesliga---germany" class="flex items-center justify-center sm:gap-2 px-3 sm:px-4 py-3 sm:py-4 sm:text-lg focus:z-10 flex-1 lg:flex-none lg:w-56 sm:min-w-32 sm:max-w-64 transition-all duration-300 relative border-b-2 tracking-wide font-mono bg-gray-100 dark:bg-slate-900 text-gray-500 dark:text-gray-400 font-normal border-transparent hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-sky-700 dark:hover:text-sky-400 hover:shadow-md hover:-translate-y-0.5 aria-selected:bg-white dark:aria-selected:bg-gray-800 aria-selected:text-sky-700 dark:aria-selected:text-sky-400 aria-selected:font-semibold aria-selected:border-sky-500 dark:aria-selected:border-sky-400 aria-selected:shadow-md"><img src="/images/leagues/Bundesliga-Germany.png" alt="Bundesliga - Germany logo" class="w-7 h-7 sm:w-6 sm:h-6 object-contain"><span class="hidden sm:inline-block">Bundesliga</span></button>
                    <button type="button" role="tab" aria-selected="false" id="tab-la-liga---spain" class="flex items-center justify-center sm:gap-2 px-3 sm:px-4 py-3 sm:py-4 sm:text-lg focus:z-10 flex-1 lg:flex-none lg:w-56 sm:min-w-32 sm:max-w-64 transition-all duration-300 relative border-b-2 tracking-wide font-mono bg-gray-100 dark:bg-slate-900 text-gray-500 dark:text-gray-400 font-normal border-transparent hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-sky-700 dark:hover:text-sky-400 hover:shadow-md hover:-translate-y-0.5 aria-selected:bg-white dark:aria-selected:bg-gray-800 aria-selected:text-sky-700 dark:aria-selected:text-sky-400 aria-selected:font-semibold aria-selected:border-sky-500 dark:aria-selected:border-sky-400 aria-selected:shadow-md"><img src="/images/leagues/LaLiga-Spain.png" alt="La Liga - Spain logo" class="w-7 h-7 sm:w-6 sm:h-6 object-contain"><span class="hidden sm:inline-block">La Liga</span></button>
                    <button type="button" role="tab" aria-selected="false" id="tab-uefa-champions-league" class="flex items-center justify-center sm:gap-2 px-3 sm:px-4 py-3 sm:py-4 sm:text-lg focus:z-10 flex-1 lg:flex-none lg:w-56 sm:min-w-32 sm:max-w-64 transition-all duration-300 relative border-b-2 tracking-wide font-mono rounded-r-md bg-gray-100 dark:bg-slate-900 text-gray-500 dark:text-gray-400 font-normal border-transparent hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-sky-700 dark:hover:text-sky-400 hover:shadow-md hover:-translate-y-0.5 aria-selected:bg-white dark:aria-selected:bg-gray-800 aria-selected:text-sky-700 dark:aria-selected:text-sky-400 aria-selected:font-semibold aria-selected:border-sky-500 dark:aria-selected:border-sky-400 aria-selected:shadow-md"><img src="/images/leagues/UEFAChampionsLeague.png" alt="UEFA Champions League logo" class="w-7 h-7 sm:w-6 sm:h-6 object-contain"><span class="hidden sm:inline-block">Champions League</span></button>
                </div>
                <script>
                    // Mark the saved league before the first paint (same rule as main.js:
                    // the stored league, else the first tab)
                    ;(() => {
                        let league = null
                        try { league = localStorage.getItem('lastUsedLeague') } catch {}
                        const id = league && 'tab-' + league.replace(/\s+/g, '-').toLowerCase()
                        const tab = (id && document.getElementById(id)) || document.querySelector('#league-tabs [role="tab"]')
                        tab.setAttribute('aria-selected', 'true')
                    })()
                </script>
            </div>
        </div>
        <!-- Error message container -->
        <div id="error-message" class="hidden bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300 px-4 py-3 rounded-lg text-center my-8 max-w-2xl mx-auto" role="alert">
            <span class="block sm:inline text-sm sm:text-base"></span>
        </div>
        <div id="matches-container" class="space-y-2 sm:space-y-3"></div>

    </main>

    <footer class="bg-white bg-opacity-80 dark:bg-gray-800 dark:bg-opacity-80 backdrop-blur-md mt-2">
        <div class="container mx-auto px-6 pt-3 sm:pt-4 pb-4">
            <!-- About section -->
            <div id="about" class="mb-5 sm:mb-6 text-center">
                <h2 class="text-sm sm:text-lg font-semibold tracking-wide text-gray-800 dark:text-gray-200 mb-2">About: The Tip Genius ⚽️</h2>
                <p class="text-xs sm:text-base text-gray-500 dark:text-gray-400">
                    This tool uses advanced LLMs and external data sources to make predictions. AI is far from perfect, so use with caution!
                </p>
            </div>
            <!-- Footer links and copyright -->
            <div class="flex justify-between items-center text-xs text-gray-500 dark:text-gray-400">
                <a href="http://linkedin.com/in/thomas-glanzer" class="text-xs sm:text-sm font-semibold hover:text-sky-700 dark:hover:text-sky-400 transition duration-200">Contact</a>
                <a href="#" class="text-xs sm:text-sm font-semibold hover:text-sky-700 dark:hover:text-sky-400 transition duration-200 md:block hidden" onclick="scrollToTop()">Back to top</a>
                <div class="text-xs sm:text-sm font-semibold">© <span id="currentYear"></span> THG</div>
            </div>
        </div>
    </footer>

<!-- Core JavaScript -->
<script src="/js/models.js" defer></script>
<script src="/js/main.js" defer></script>
<script src="/js/register-sw.js" defer></script>

</body>
</html>
