# API Configuration File for Odd Providers

# Configuration for Odds API
odds_api:
  api_key_env_name: ODDS_API_KEY
  base_url: https://api.the-odds-api.com/v4/sports/
  parameters: odds?regions=eu&oddsFormat=decimal

  # Mapping of User Friendly Sport Names to API Sport Keys
  sports_mapping:
    Premier League - England: soccer_epl
    La Liga - Spain: soccer_spain_la_liga
    Bundesliga - Germany: soccer_germany_bundesliga
    UEFA Champions League: soccer_uefa_champs_league
    UEFA Europa League: soccer_uefa_europa_league

  # The API's sport_title per sport (appended to the prompt with additional_info).
  # The live workflow takes it from the API response; these values are only used
  # to rebuild past prompts (utils/backfill_llm_predictions.py) and must match it.
  # Checked against the stored data/api_result responses (2024-2025)
  sport_titles:
    Premier League - England: EPL
    La Liga - Spain: La Liga - Spain
    Bundesliga - Germany: Bundesliga - Germany
    UEFA Champions League: UEFA Champions League

  # Define the Bookmakers to be used for Odds API (in order of priority)
  bookmaker_priority:
    - tipico_de
    - nordicbet
    - williamhill
